<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Euler identity parametric background">
  <defs>
    <style>
      .curve {
        fill: none;
        stroke: #000000;
        stroke-width: 4.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .axis {
        fill: none;
        stroke: #000000;
        stroke-width: 1;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Subtle guide axes -->
  <line class="axis" x1="260" y1="260" x2="660" y2="260" opacity="0.5" />
  <line class="axis" x1="460" y1="60" x2="460" y2="460" opacity="0.5" />

  <!-- e^(-i pi t), t in [0,1] : lower semicircle from (1,0) to (-1,0) -->
  <path class="curve" d="M 641.818 260 A 181.818 181.818 0 0 0 278.182 260" opacity="0.46" />

  <!-- second segment: trace x-axis from -1 to 0 -->
  <path class="curve" d="M 278.182 260 L 460 260" opacity="0.42" />

</svg>
